<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>HomeBase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ── Loading Overlay ─────────────────────────────────── -->
  <div id="loading-overlay">
    <div class="spinner"></div>
  </div>

  <!-- ── Auth Screen ─────────────────────────────────────── -->
  <div id="auth-screen" class="screen hidden">
    <div class="auth-wrap">
      <div class="auth-header">
        <div class="auth-logo">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9,22 9,12 15,12 15,22"/>
          </svg>
        </div>
        <h1>HomeBase</h1>
        <p>Your home improvement tracker</p>
      </div>

      <div class="auth-card">
        <div class="tab-bar">
          <button class="tab active" id="tab-signin" onclick="switchAuthTab('signin')">Sign In</button>
          <button class="tab" id="tab-signup" onclick="switchAuthTab('signup')">Sign Up</button>
        </div>

        <form id="auth-form">
          <div class="form-group">
            <label for="auth-email">Email</label>
            <input type="email" id="auth-email" placeholder="you@example.com"
                   required autocomplete="email" inputmode="email">
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <div class="input-reveal">
              <input type="password" id="auth-password" placeholder="••••••"
                     required minlength="6" autocomplete="current-password">
              <button type="button" class="reveal-btn" onclick="togglePasswordReveal()" title="Show password" aria-label="Toggle password visibility">
                <svg class="eye-show" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
                </svg>
                <svg class="eye-hide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
          <p id="auth-error" class="error-msg hidden"></p>
          <button type="submit" id="auth-btn" class="btn btn-primary btn-block">Sign In</button>
        </form>
      </div>
    </div>
  </div>

  <!-- ── Main App ─────────────────────────────────────────── -->
  <div id="main-app" class="screen hidden">

    <!-- Header -->
    <header id="app-header">
      <span id="app-brand" class="app-brand">Homebase</span>
      <button id="back-btn" class="icon-btn hidden" onclick="handleBack()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <h2 id="page-title">Dashboard</h2>
      <button class="icon-btn" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
        </svg>
      </button>
      <button class="icon-btn" onclick="showSettingsModal()" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
      </button>
    </header>

    <!-- Desktop Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-logo">
        <span class="app-brand">homebase</span>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-btn" data-view="dashboard" onclick="navigate('dashboard')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9,22 9,12 15,12 15,22"/>
          </svg>
          Dashboard
        </button>
        <button class="nav-btn" data-view="areas" onclick="navigate('areas')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
          </svg>
          Areas
        </button>
        <button class="nav-btn" data-view="projects" onclick="navigate('projects')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 18a1 1 0 001 1h18a1 1 0 001-1v-2a1 1 0 00-1-1H3a1 1 0 00-1 1v2z"/>
            <path d="M10 10V5a2 2 0 014 0v5"/>
            <path d="M4 15v-3a8 8 0 0116 0v3"/>
          </svg>
          Projects
        </button>
        <button class="nav-btn" data-view="issues" onclick="navigate('issues')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          Tasks
        </button>
      </nav>
      <div class="sidebar-footer">
        <button class="btn btn-ghost btn-sm" onclick="handleSignOut()">Sign Out</button>
        <a href="https://github.com/jburgh/homebase" target="_blank" rel="noopener" class="sidebar-github" title="View on GitHub">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.603-3.369-1.342-3.369-1.342-.454-1.155-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.578 9.578 0 0112 6.836a9.59 9.59 0 012.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.578.688.48C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"/>
          </svg>
        </a>
      </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content"></main>

    <!-- Bottom Navigation (mobile) -->
    <nav id="bottom-nav">
      <button class="nav-btn active" data-view="dashboard" onclick="navigate('dashboard')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-view="areas" onclick="navigate('areas')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>Areas</span>
      </button>
      <button class="nav-btn" data-view="projects" onclick="navigate('projects')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 18a1 1 0 001 1h18a1 1 0 001-1v-2a1 1 0 00-1-1H3a1 1 0 00-1 1v2z"/>
          <path d="M10 10V5a2 2 0 014 0v5"/>
          <path d="M4 15v-3a8 8 0 0116 0v3"/>
        </svg>
        <span>Projects</span>
      </button>
      <button class="nav-btn" data-view="issues" onclick="navigate('issues')">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        <span>Tasks</span>
      </button>
    </nav>
  </div>

  <!-- ── General Modal ────────────────────────────────────── -->
  <div id="modal-overlay" class="hidden" onclick="handleModalOverlayClick(event)">
    <div id="modal-box" role="dialog" aria-modal="true">
      <div id="modal-header">
        <h3 id="modal-title"></h3>
        <button class="icon-btn" onclick="hideModal()" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div id="modal-body"></div>
      <div id="modal-footer"></div>
    </div>
  </div>

  <!-- ── House Setup Overlay (first-run, non-dismissible) ── -->
  <div id="house-setup-overlay" class="hidden">
    <div class="setup-box">
      <div class="setup-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
          <polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
      </div>
      <h2>Welcome to HomeBase!</h2>
      <p>Let's start by naming your home. You can update these details anytime.</p>
      <form id="house-setup-form">
        <div class="form-group">
          <label for="house-name-input">Home Name <span class="req">*</span></label>
          <input type="text" id="house-name-input" placeholder="e.g. The Johnson Home"
                 required maxlength="100" autocomplete="off">
        </div>
        <div class="form-group">
          <label for="house-address-input">Address</label>
          <input type="text" id="house-address-input" placeholder="123 Main St" maxlength="200">
        </div>
        <div class="form-group">
          <label for="house-year-input">Year Built</label>
          <input type="number" id="house-year-input" placeholder="1995" min="1800" max="2030">
        </div>
        <p id="house-setup-error" class="error-msg hidden"></p>
        <button type="submit" id="house-setup-btn" class="btn btn-primary btn-block">Get Started</button>
      </form>
    </div>
  </div>

</div><!-- #app -->
<script type="module" src="app.js"></script>
</body>
</html>
